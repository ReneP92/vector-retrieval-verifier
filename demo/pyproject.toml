[project]
name = "rag-retrieval-demo"
version = "0.1.0"
description = "Production-shaped RAG retrieval debugging demo using BEIR FiQA"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.2.14",
    "cohere>=5.20.0",
    "fastapi>=0.116.0",
    "httpx>=0.28.0",
    "jinja2>=3.1.0",
    "numpy>=2.2.0",
    "openai>=1.97.0",
    "pydantic-settings>=2.10.0",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "pytest>=8.4.0",
    "ruff>=0.12.0",
    "ty>=0.0.1a16",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["B", "I", "UP"]

[tool.ty.src]
include = ["app", "tests"]
